[package]
name = "deez-currency-calculator"
version = "1.0.0"
description = "Deez Currency Calculator desktop shell"
authors = ["Dale"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "deez_currency_calculator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
